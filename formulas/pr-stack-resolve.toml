formula = "pr-stack-resolve"
version = 1
contract = "graph.v2"
extends = ["fix-loop-base"]
target_required = false

description = """
Resolve all open PRs in a Sverka stacked-PR stack: rebase, address review
comments, follow CI to green, loop until all PRs are resolved.

This formula extends the standard Gas City fix-loop-base methodology. The
'findings' are the open review threads, CI failures, and merge conflicts on
each PR in the stack. The fix loop iterates until all PRs are resolved.
"""

[catalog]
name = "pr-stack-resolve"
description = "Resolve all open PRs in a Sverka stack: rebase, /act on comments, follow CI, loop until green."

[vars]
[vars.context_path]
description = "Optional context bundle path."
default = ""

[vars.findings_path]
description = "Path to the PR stack status report (produced by the discover step)."
default = ".gc/pr-stack-status.json"

[vars.implementation_target]
description = "Role target for fix work."
default = "builder"

[vars.max_iterations]
description = "Maximum fix/review attempts per PR."
default = "10"

# Step 1: Discover and assess PR stack
[[steps]]
id = "plan-fixes"
title = "Discover and assess PR stack"
metadata = { "gc.run_target" = "builder" }
description = """
Run the deterministic check script to discover all open PRs and their
resolution state:

    bash assets/scripts/pr-stack-resolve.sh

This outputs a JSON report showing each PR's: merge state, open review
threads, CI status, and whether it's behind its base.

If ALL PRs are resolved (exit 0), close the formula — nothing to do.

For each PR that NEEDS WORK, note the reasons:
- merge_conflict -> needs rebase
- open_threads(N) -> needs /act on N review comments
- ci_failing(checks) -> needs CI fix
- ci_pending -> wait for CI to complete
- behind_base(N) -> needs rebase on base

Order work by stack position (base -> top) — fixing a lower PR may
cascade to upper PRs.
"""

# Step 2: Apply fixes (rebase + /act on comments + CI fix)
[[steps]]
id = "apply-fixes"
title = "Rebase, address comments, fix CI"
needs = ["plan-fixes"]
metadata = { "gc.run_target" = "{{implementation_target}}" }
description = """
For each PR that needs work, working from BOTTOM of stack to TOP:

1. REBASE: For PRs behind base or with merge conflicts:
   - git fetch origin
   - git checkout <head-ref>
   - git rebase origin/<base-ref>
   - If conflicts: STOP, report to mayor. Do NOT force.
   - If success: git push --force-with-lease origin <head-ref>
   - After rebasing, ALL PRs above must also be rebased. Cascade upward.

2. /ACT ON COMMENTS: For PRs with open review threads:
   - gh api repos/sverka-dev/sverka/pulls/<PR>/comments
   - For each unresolved thread: fix the code or reply with reasoning.
   - After each /act, re-check for NEW comments. Loop until stable.

3. CI FOLLOWUP: For PRs with failing CI:
   - gh pr checks <PR> --watch
   - Read failing logs: gh run view --log-failed
   - Fix root cause, push, wait for CI again.
   - Re-check for new quality findings (SonarCloud, CodeQL, etc.).

NEVER use `git push --force` without `--force-with-lease`.
NEVER skip the fetch step.
NEVER work on a stale branch.

Core pipeline MUST pass locally before pushing:
    bun run build && bun run lint && bun run typecheck && bun run test
"""

# Step 3: Re-review — verify all PRs are resolved
[[steps]]
id = "re-review"
title = "Verify all PRs are resolved"
needs = ["apply-fixes"]
metadata = { "gc.run_target" = "reviewer" }
description = """
Run the deterministic check script one final time:

    bash assets/scripts/pr-stack-resolve.sh

A PR is RESOLVED when ALL of:
- CI green (build, lint, typecheck, test, quality gates)
- All review threads resolved (0 open)
- No merge conflicts with base
- Branch is rebased on latest base
- No new quality findings
- At least one follow-up check after last /act (no new comments)

If any PR is still not resolved, loop back:
- merge_conflict -> rebase
- open_threads -> act on comments
- ci_failing -> CI fix
- behind_base -> rebase

If ALL PRs are resolved, report to the mayor:
- Total PRs resolved
- Any PRs skipped and why
- Summary of changes made

The mayor will send mail to the human with the resolution report.
"""

[steps.check]
max_attempts = 3

[steps.check.check]
mode = "exec"
path = "assets/scripts/pr-stack-resolve.sh"
timeout = "5m"
