formula = "sverka-bootstrap"
description = "Bootstrap the Sverka project: spec tree, monorepo scaffold, README, website skeleton"

[requires]
formula_compiler = ">=2.0.0"

[[steps]]
id = "spec-tree"
title = "Architect: create numbered spec tree"
description = """
Create the full spec tree in specs/ covering the entire project waterfall.
Each spec is numbered and covers one package or concern.
The tree must include all packages from the product spec and the website/docs.
"""
agent = "architect"

[[steps]]
id = "engdocs"
title = "Architect: create engineering docs structure"
description = """
Create engdocs/ with architecture overview, ADR template, and contributor
guide. Document-first means engineering docs are written before code.
"""
agent = "architect"

[[steps]]
id = "monorepo"
title = "Builder: scaffold nx monorepo with tsdown"
description = """
Set up the nx TypeScript monorepo with bun workspaces, tsdown build,
vitest testing, and all package directories from the product spec.
Create root package.json, nx.json, tsconfig.base.json, bunfig.toml.
Each package gets a minimal package.json and src/index.ts stub.
"""
needs = ["spec-tree", "engdocs"]
agent = "builder"

[[steps]]
id = "readme"
title = "Builder: write professional README"
description = """
Write a professional README.md for the Sverka project.
Must include: project description, features, quick start, installation,
usage examples, architecture overview, contributing, license.
Reference sverka.dev as the website.
"""
needs = ["monorepo"]
agent = "builder"

[[steps]]
id = "website"
title = "Builder: scaffold minimalistic website"
description = """
Scaffold the sverka.dev website using a modern minimalistic framework
(Astro or Vite + a minimal CSS approach). The site must be informative
but minimal: hero, features, quick start, links to docs.
"""
needs = ["monorepo"]
agent = "builder"

[[steps]]
id = "review"
title = "Reviewer: gate Wave 0"
description = """
Review all Wave 0 deliverables: spec tree completeness, monorepo builds,
README quality, website runs. Run bun install, bun run build, bun test.
Approve or reject with specific feedback.
"""
needs = ["readme", "website"]
agent = "reviewer"

[[steps]]
id = "finalize"
title = "Finalize Wave 0"
description = "Wave 0 complete. Mayor commits work and prepares Wave 1."
needs = ["review"]
