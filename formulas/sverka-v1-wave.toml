formula = "sverka-v1-wave"
description = "Execute a Sverka v1 feature wave: architect designs from v1 mega-plan, builder implements (TDD), reviewer gates, finalize as stacked PR"

[requires]
formula_compiler = ">=2.0.0"

[[steps]]
id = "design"
title = "Architect: design spec and plan for v1 feature"
description = """
Read the v1 mega-plan epic (use `bd show <wave-epic-id>` to get the wave's
feature tasks). For each feature task in the wave, produce a spec in
specs/NN-<feature>/spec.md and a plan in engdocs/architecture/v1-<feature>-plan.md.

The architect MUST:
1. Read the architecture spec (specs/architecture-spec.md) for relevant sections.
2. Read the comparative analysis memory (bd memories "gh-aw" / "Mastra" / "Temporal" / "Dagger").
3. For each feature, fill in spec: Overview, Goals, Non-goals, Interfaces,
   Data models, Error handling, Test plan, Capability mapping.
4. Trim per minimalist principles — cut everything not required.
5. Produce TDD implementation plan.
6. Verify interfaces match existing Sverka model (Definition Graph, StepDefinition,
   Engine contract, Target contract, Plugin facets).
7. Record ADRs for significant decisions in engdocs/adr/.
8. CRITICAL: every feature must declare capability identifiers and map to
   native/lowered/emulated/unsupported per target (GHA, GitLab, native engine).

The spec is the contract. Get it right.
"""
agent = "architect"

[[steps]]
id = "implement"
title = "Builder: implement from spec (TDD)"
description = """
The builder reads each spec and plan, writes failing tests first, then
implements until all tests pass and gates are green.

The builder MUST:
1. Write tests first (TDD) — one test per spec test plan item.
2. Implement until all tests pass.
3. Run: bun run test, bun run typecheck, bun run lint, bun run build.
4. All gates must be green (0 errors, 0 lint errors).
5. No `any` types — use `unknown` and narrow.
6. Public API exported from src/index.ts.
7. Custom error classes per package with `override` on `cause`.
8. For new packages: scaffold with package.json (.mjs/.d.mts), project.json,
   tsconfig, tsdown.config, index.ts.
9. For delegated engines: implement Engine contract (run, cancel, resume).
10. For new targets: implement Target contract (analyze, lower, emit).
11. For MCP integration: use @modelcontextprotocol/sdk.
12. git add all impl+test files (conservative profile — do NOT commit, but stage).

COMMIT HYGIENE: stage ONLY the wave's package files + specs + plans + bun.lock;
EXCLUDE city.toml, agents/, .devin/, .gc/, .beads/, formulas/, engdocs/adr/
(unless the wave specifically adds ADRs).
"""
needs = ["design"]
agent = "builder"

[[steps]]
id = "review"
title = "Reviewer: gate quality against spec and architecture"
description = """
The reviewer checks implementation against BOTH the feature spec AND the
architecture spec (specs/architecture-spec.md).

The reviewer MUST:
1. Run all gates fresh (don't trust builder): test, typecheck, lint, build.
2. Verify implementation matches spec — not just 'close enough.'
3. Check capability manifest: every feature declares capabilities + support levels.
4. Reject if: over-engineered, under-tested, or spec says X but code does Y.
5. Reject if: any `any` types, missing exports, error classes without override.
6. For delegated engines: verify Engine contract compliance.
7. For new targets: verify Target contract + deterministic output (no network).
8. For MCP: verify tool mapping is correct and secure.
9. Verify conformance: if the wave touches authoring surfaces, all 3 (or 4 with
   Markdown) must produce equivalent Definition Graph.
10. Run `git status --short` and confirm every impl+test file is staged.

On rejection, report specific issues to mayor with bead ID.
"""
needs = ["implement"]
agent = "reviewer"

[[steps]]
id = "finalize"
title = "Finalize wave and prepare stacked PR"
description = """
Wave complete. Mayor commits, creates stacked PR, dispatches next wave.

The mayor MUST:
1. Close the wave epic and all sub-tasks.
2. Verify git status — stage only wave files (exclude city.toml, agents/,
   .devin/, .gc/, .beads/, formulas/).
3. Create stacked PR: branch v1-<wave-num>-<feature>, base = previous wave branch
   (or main for Wave 1). Use gh-stack if available, else manual.
4. Push branch, create PR with `gh pr create --base <prev-wave-branch>`.
5. Run `bd dolt push` to sync beads.
6. Send mail to human: 'Wave <N> complete: <features>' with summary.
7. Check `bd ready` for next unblocked wave, dispatch immediately.
8. Update mega-plan memory with `bd remember`.
"""
needs = ["review"]
agent = "mayor"
