[workspace]
provider = "devin"
env = { DEVIN_MODEL = "glm-5-2", DEVIN_PERMISSION_MODE = "dangerous" }

[providers]
[providers.devin]
base = ""
command = "devin"
prompt_mode = "none"
ready_delay_ms = 2000
instructions_file = "AGENTS.md"
resume_flag = "--resume"

[daemon]
formula_v2 = true
nudge_dispatcher = "supervisor"
max_wakes_per_tick = 2
probe_concurrency = 2
tick_debounce = "500ms"

[imports.core]
source = "https://github.com/gastownhall/gascity/tree/main/internal/bootstrap/packs/core"
version = "sha:f895c0ff47d6ee9334ed282a416387eb5b084d24"
shadow = "silent"
