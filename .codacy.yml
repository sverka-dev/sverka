---
# Codacy configuration — focus on real issues, exclude noise
# https://docs.codacy.com/repositories-configure/codacy-configuration-file/

# Exclude non-source paths from analysis
exclude_paths:
  - "**/*.md"
  - "**/*.json"
  - "**/*.toml"
  - "**/*.yml"
  - "**/*.yaml"
  - "**/*.config.ts"
  - "**/tsdown.config.ts"
  - "**/vitest.config.ts"
  - "**/__tests__/**"
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "**/*.spec.ts"
  - "pack/**"
  - ".agents/**"
  - ".gc/**"
  - ".husky/**"
  - ".devin/**"
  - ".beads/**"
  - ".evidence/**"
  - ".nx/**"
  - "website/**"
  - "engdocs/**"
  - "specs/**"
  - "skills/**"
  - "template-fragments/**"
  - "packages/*/fixtures/**"
  - "dist/**"
  - "node_modules/**"
  - "scripts/**"

# Configure tools
engines:
  # ESLint v9 — rely on the repository's native eslint.config.mjs for rules.
  eslint-9:
    enabled: true
    exclude_paths:
      # HTML renderer uses template literals with HTML by design —
      # "template literal looks like HTML" and "replaceAll" warnings
      # are false positives for an HTML generator on Node 24+.
      - "packages/reporter/src/html-renderer.ts"
  # Lizard — complexity metrics. Exclude html-renderer.ts since
  # generateHtml is inherently long (assembles a full HTML document)
  # and cannot be meaningfully split further without harming readability.
  lizard:
    enabled: true
    exclude_paths:
      - "packages/reporter/src/html-renderer.ts"
  # OpenGrep (Semgrep) — security patterns. html-renderer.ts generates
  # HTML by design; "html-in-template-string" and "replaceAll" rules
  # are false positives for an HTML generator on Node 24+.
  opengrep:
    enabled: true
    exclude_paths:
      - "packages/reporter/src/html-renderer.ts"
  # Legacy semgrep engine name (Codacy migrated to opengrep in Feb 2026)
  semgrep:
    enabled: true
    exclude_paths:
      - "packages/reporter/src/html-renderer.ts"

# Disable analysis of markdown files (we only care about code)
languages:
  markdown:
    enabled: false
