      - ESLint9_es-x_no-binary-numeric-literals
      - ESLint9_es-x_no-octal-numeric-literals
      - ESLint9_es-x_no-regex-u-flag
      - ESLint9_es-x_no-regex-y-flag
      - ESLint9_es-x_no-unicode-codepoint-escapes
      - ESLint9_es-x_no-object-super-properties
      - ESLint9_es-x_no-array-prototype-copywithin
      - ESLint9_es-x_no-array-prototype-fill
      - ESLint9_es-x_no-array-prototype-find
      - ESLint9_es-x_no-array-prototype-findindex
      - ESLint9_es-x_no-array-prototype-flat
      - ESLint9_es-x_no-array-prototype-flatmap
      - ESLint9_es-x_no-array-prototype-includes
      - ESLint9_es-x_no-array-prototype-keys
      - ESLint9_es-x_no-array-prototype-values
      - ESLint9_es-x_no-array-prototype-entries
      - ESLint9_es-x_no-string-prototype-at
      - ESLint9_es-x_no-string-prototype-codepoint-at
      - ESLint9_es-x_no-string-prototype-ends-with
      - ESLint9_es-x_no-string-prototype-includes
      - ESLint9_es-x_no-string-prototype-match-all
      - ESLint9_es-x_no-string-prototype-pad-end
      - ESLint9_es-x_no-string-prototype-pad-start
      - ESLint9_es-x_no-string-prototype-repeat
      - ESLint9_es-x_no-string-prototype-starts-with
      - ESLint9_es-x_no-string-prototype-trim
      - ESLint9_es-x_no-string-prototype-trimstart
      - ESLint9_es-x_no-string-prototype-trimend
      - ESLint9_es-x_no-string-raw
      - ESLint9_es-x_no-number-constructor
      - ESLint9_es-x_no-number-isfinite
      - ESLint9_es-x_no-number-isinteger
      - ESLint9_es-x_no-number-isnan
      - ESLint9_es-x_no-number-issafeinteger
      - ESLint9_es-x_no-number-max-safe-integer
      - ESLint9_es-x_no-number-min-safe-integer
      - ESLint9_es-x_no-number-epsilon
      - ESLint9_es-x_no-number-parse-float
      - ESLint9_es-x_no-number-parse-integer
      - ESLint9_es-x_no-math-acosh
      - ESLint9_es-x_no-math-asinh
      - ESLint9_es-x_no-math-atanh
      - ESLint9_es-x_no-math-cbrt
      - ESLint9_es-x_no-math-clz32
      - ESLint9_es-x_no-math-cosh
      - ESLint9_es-x_no-math-expm1
      - ESLint9_es-x_no-math-fround
      - ESLint9_es-x_no-math-hypot
      - ESLint9_es-x_no-math-imul
      - ESLint9_es-x_no-math-log10
      - ESLint9_es-x_no-math-log1p
      - ESLint9_es-x_no-math-log2
      - ESLint9_es-x_no-math-sign
      - ESLint9_es-x_no-math-sinh
      - ESLint9_es-x_no-math-tanh
      - ESLint9_es-x_no-object-assign
      - ESLint9_es-x_no-object-is
      - ESLint9_es-x_no-object-entries
      - ESLint9_es-x_no-object-fromentries
      - ESLint9_es-x_no-object-getownpropertydescriptors
      - ESLint9_es-x_no-object-values
      - ESLint9_es-x_no-object-keys
      - ESLint9_es-x_no-object-define-property
      - ESLint9_es-x_no-object-define-properties
      - ESLint9_es-x_no-object-create
      - ESLint9_es-x_no-object-get-prototype-of
      - ESLint9_es-x_no-object-set-prototype-of
      - ESLint9_es-x_no-date-prototype-to-primitive
