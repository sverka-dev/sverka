      - ESLint9_es-x_no-intl
      - ESLint9_es-x_no-atomics
      - ESLint9_es-x_no-shared-array-buffer

  # Markdown linter — disable noisy rules
  markdownlint:
    enabled: true
    disable_rules:
      - MD034  # Bare URL used
      - MD024  # Multiple headings with same content
      - MD025  # Multiple top-level headings
      - MD036  # Emphasis used instead of a heading
      - MD041  # First line in a file should be a top-level heading

# Disable analysis of markdown files (we only care about code)
languages:
  markdown:
    enabled: false
