---
# Codacy configuration — focus on real issues, exclude noise
# https://docs.codacy.com/repositories-configure/codacy-configuration-file/

# Exclude non-source paths from analysis
exclude_paths:
  - "**/*.md"
  - "**/*.json"
  - "**/*.toml"
  - "**/*.yml"
  - "**/*.yaml"
  - "**/*.config.ts"
  - "**/tsdown.config.ts"
  - "**/vitest.config.ts"
  - "**/__tests__/**"
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "**/*.spec.ts"
  - "pack/**"
  - ".agents/**"
  - ".gc/**"
  - ".husky/**"
  - ".devin/**"
  - ".beads/**"
  - ".evidence/**"
  - ".nx/**"
  - "website/**"
  - "engdocs/**"
  - "specs/**"
  - "skills/**"
  - "template-fragments/**"
  - "packages/*/fixtures/**"
  - "dist/**"
  - "node_modules/**"
  - "scripts/**"

# Configure tools
engines:
  # ESLint v9 — rely on the repository's native eslint.config.mjs for rules.
  # HTML generator files use template literals with HTML by design; the
  # "template literal looks like HTML" and "replaceAll" warnings are
  # false positives for HTML generators on Node 24+. The files are
  # still scanned by OpenGrep for real security issues.
  eslint-9:
    enabled: true
    exclude_paths:
      - "packages/reporter/src/html-renderer.ts"
      - "packages/sarif-viewer-web/src/viewer.ts"
      - "packages/sarif-viewer-web/src/html-generator.ts"
      - "packages/ui/src/dashboard.ts"
      - "packages/playground/src/app.ts"
  # Lizard — complexity metrics. Exclude HTML generators since
  # generateSarifHtml/generateHtml are inherently long (assembles a full
  # HTML document) and cannot be meaningfully split further without
  # harming readability.
  lizard:
    enabled: true
    exclude_paths:
      - "packages/reporter/src/html-renderer.ts"
      - "packages/sarif-viewer-web/src/viewer.ts"
      - "packages/sarif-viewer-web/src/html-generator.ts"
      - "packages/ui/src/dashboard.ts"
      - "packages/playground/src/app.ts"

# Disable analysis of markdown files (we only care about code)
languages:
  markdown:
    enabled: false
