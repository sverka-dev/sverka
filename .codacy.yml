---
# Codacy configuration — focus on real issues, exclude noise
# https://docs.codacy.com/repositories-configure/codacy-configuration-file/
#
# NOTE: Codacy's .codacy.yml only supports `exclude_paths` and `base_sub_dir`
# at the engine level. The `disable_rules` key is NOT a documented feature and
# is silently ignored. To disable specific code patterns, use the Codacy UI
# Code patterns page or the tool's own configuration file (e.g. .eslintrc.json).

# Exclude non-source paths from analysis
exclude_paths:
  - "**/*.md"
  - "**/*.json"
  - "**/*.toml"
  - "**/*.yml"
  - "**/*.yaml"
  - "**/*.config.ts"
  - "**/tsdown.config.ts"
  - "**/vitest.config.ts"
  - "**/__tests__/**"
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "**/*.spec.ts"
  - "pack/**"
  - ".agents/**"
  - ".gc/**"
  - ".husky/**"
  - ".devin/**"
  - ".beads/**"
  - ".evidence/**"
  - ".nx/**"
  - "website/**"
  - "engdocs/**"
  - "specs/**"
  - "skills/**"
  - "template-fragments/**"
  - "dist/**"
  - "node_modules/**"
  - ".opencode/**"

# Configure tools — exclude all JS/TS source from Codacy's ESLint engines.
# Codacy's ESLint runs eslint-plugin-es-x which flags ES2015+ syntax (modules,
# classes, const, arrow functions, etc.) as forbidden. These rules are
# inappropriate for a Node 24 / Bun / TypeScript project. The repository has
# its own ESLint config (.eslintrc.json / eslint.config.mjs) that explicitly
# disables all es-x rules, but Codacy does not honour that config unless
# activated via the Codacy UI Code patterns page. Excluding all source files
# from Codacy's ESLint engines is the only reliable .codacy.yml workaround.
engines:
  eslint-8:
    exclude_paths:
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.js"
      - "**/*.jsx"
      - "**/*.mjs"
      - "**/*.cjs"
  eslint-9:
    exclude_paths:
      - "**/*.ts"
      - "**/*.tsx"
      - "**/*.js"
      - "**/*.jsx"
      - "**/*.mjs"
      - "**/*.cjs"

# Disable analysis of markdown files (we only care about code)
languages:
  markdown:
    enabled: false

  # Legacy ESLint engine name (deprecated but still accepted)
  eslint:
    enabled: true
    disable_rules:
      - ESLint8_es-x_no-arrow-functions
      - ESLint8_es-x_no-modules
      - ESLint8_es-x_no-block-scoped-variables
      - ESLint8_es-x_no-trailing-commas
      - ESLint8_es-x_no-template-literals
      - ESLint8_es-x_no-classes
      - ESLint8_es-x_no-default-parameters
      - ESLint8_es-x_no-destructuring
      - ESLint8_es-x_no-rest-spread-properties
      - ESLint8_es-x_no-spread-elements
      - ESLint8_es-x_no-async-functions
      - ESLint8_es-x_no-generators
      - ESLint8_es-x_no-for-of-loops
      - ESLint8_es-x_no-exponential-operators
      - ESLint8_es-x_no-promise-objects
      - ESLint8_es-x_no-symbol
      - ESLint8_es-x_no-map
      - ESLint8_es-x_no-set
      - ESLint8_es-x_no-weak-map
      - ESLint8_es-x_no-weak-set
      - ESLint8_es-x_no-proxy
      - ESLint8_es-x_no-reflect
