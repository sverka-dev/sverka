---
# Codacy configuration — focus on real issues, exclude noise
# https://docs.codacy.com/repositories-configure/codacy-configuration-file/

# Exclude non-source paths from analysis
exclude_paths:
  - "**/*.md"
  - "**/*.json"
  - "**/*.toml"
  - "**/*.yml"
  - "**/*.yaml"
  - "**/*.config.ts"
  - "**/tsdown.config.ts"
  - "**/vitest.config.ts"
  - "**/__tests__/**"
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "**/*.spec.ts"
  - "pack/**"
  - ".agents/**"
  - ".gc/**"
  - ".husky/**"
  - ".devin/**"
  - ".beads/**"
  - ".evidence/**"
  - ".nx/**"
  - "website/**"
  - "engdocs/**"
  - "specs/**"
  - "skills/**"
  - "template-fragments/**"
  - "dist/**"
  - "node_modules/**"
  - ".opencode/**"

# Configure tools
engines:
  # ESLint v8 — disable rules inappropriate for Node 24 / Bun / TypeScript project
  # (ESLint 8 may be the active engine since ESLint 9 is not enabled by default)
  eslint-8:
    enabled: true
    disable_rules:
      # eslint-plugin-es-x: forbids ES2015+ syntax (arrow functions, const, import, etc.)
      # Completely irrelevant for a modern TypeScript project targeting Node 24+
      - ESLint8_es-x_no-arrow-functions
      - ESLint8_es-x_no-modules
      - ESLint8_es-x_no-block-scoped-variables
      - ESLint8_es-x_no-trailing-commas
      - ESLint8_es-x_no-template-literals
      - ESLint8_es-x_no-classes
      - ESLint8_es-x_no-default-parameters
      - ESLint8_es-x_no-destructuring
      - ESLint8_es-x_no-rest-spread-properties
      - ESLint8_es-x_no-spread-elements
      - ESLint8_es-x_no-async-functions
      - ESLint8_es-x_no-generators
      - ESLint8_es-x_no-for-of-loops
      - ESLint8_es-x_no-exponential-operators
      - ESLint8_es-x_no-promise-objects
      - ESLint8_es-x_no-symbol
      - ESLint8_es-x_no-map
      - ESLint8_es-x_no-set
      - ESLint8_es-x_no-weak-map
      - ESLint8_es-x_no-weak-set
      - ESLint8_es-x_no-proxy
      - ESLint8_es-x_no-reflect
      - ESLint8_es-x_no-binary-numeric-literals
      - ESLint8_es-x_no-octal-numeric-literals
      - ESLint8_es-x_no-regex-u-flag
      - ESLint8_es-x_no-regex-y-flag
      - ESLint8_es-x_no-unicode-codepoint-escapes
      - ESLint8_es-x_no-object-super-properties
      - ESLint8_es-x_no-array-prototype-copywithin
      - ESLint8_es-x_no-array-prototype-fill
      - ESLint8_es-x_no-array-prototype-find
      - ESLint8_es-x_no-array-prototype-findindex
      - ESLint8_es-x_no-array-prototype-flat
      - ESLint8_es-x_no-array-prototype-flatmap
      - ESLint8_es-x_no-array-prototype-includes
      - ESLint8_es-x_no-array-prototype-keys
      - ESLint8_es-x_no-array-prototype-values
      - ESLint8_es-x_no-array-prototype-entries
      - ESLint8_es-x_no-string-prototype-at
      - ESLint8_es-x_no-string-prototype-codepoint-at
      - ESLint8_es-x_no-string-prototype-ends-with
      - ESLint8_es-x_no-string-prototype-includes
      - ESLint8_es-x_no-string-prototype-match-all
      - ESLint8_es-x_no-string-prototype-pad-end
      - ESLint8_es-x_no-string-prototype-pad-start
      - ESLint8_es-x_no-string-prototype-repeat
      - ESLint8_es-x_no-string-prototype-starts-with
      - ESLint8_es-x_no-string-prototype-trim
      - ESLint8_es-x_no-string-prototype-trimstart
      - ESLint8_es-x_no-string-prototype-trimend
      - ESLint8_es-x_no-string-raw
      - ESLint8_es-x_no-number-constructor
      - ESLint8_es-x_no-number-isfinite
      - ESLint8_es-x_no-number-isinteger
      - ESLint8_es-x_no-number-isnan
      - ESLint8_es-x_no-number-issafeinteger
      - ESLint8_es-x_no-number-max-safe-integer
      - ESLint8_es-x_no-number-min-safe-integer
      - ESLint8_es-x_no-number-epsilon
      - ESLint8_es-x_no-number-parse-float
      - ESLint8_es-x_no-number-parse-integer
      - ESLint8_es-x_no-math-acosh
      - ESLint8_es-x_no-math-asinh
      - ESLint8_es-x_no-math-atanh
      - ESLint8_es-x_no-math-cbrt
      - ESLint8_es-x_no-math-clz32
      - ESLint8_es-x_no-math-cosh
      - ESLint8_es-x_no-math-expm1
      - ESLint8_es-x_no-math-fround
      - ESLint8_es-x_no-math-hypot
      - ESLint8_es-x_no-math-imul
      - ESLint8_es-x_no-math-log10
      - ESLint8_es-x_no-math-log1p
      - ESLint8_es-x_no-math-log2
      - ESLint8_es-x_no-math-sign
      - ESLint8_es-x_no-math-sinh
      - ESLint8_es-x_no-math-tanh
      - ESLint8_es-x_no-object-assign
      - ESLint8_es-x_no-object-is
      - ESLint8_es-x_no-object-entries
      - ESLint8_es-x_no-object-fromentries
      - ESLint8_es-x_no-object-getownpropertydescriptors
      - ESLint8_es-x_no-object-values
      - ESLint8_es-x_no-object-keys
      - ESLint8_es-x_no-object-define-property
      - ESLint8_es-x_no-object-define-properties
      - ESLint8_es-x_no-object-create
      - ESLint8_es-x_no-object-get-prototype-of
      - ESLint8_es-x_no-object-set-prototype-of
      - ESLint8_es-x_no-date-prototype-to-primitive
      - ESLint8_es-x_no-symbol-prototype-description
      - ESLint8_es-x_no-intl
      - ESLint8_es-x_no-atomics
      - ESLint8_es-x_no-shared-array-buffer

  # ESLint v9 — same disable list for when ESLint 9 is enabled
  eslint-9:
    enabled: true
    disable_rules:
      # eslint-plugin-es-x: forbids ES2015+ syntax (arrow functions, const, import, etc.)
      # Completely irrelevant for a modern TypeScript project targeting Node 24+
      - ESLint9_es-x_no-arrow-functions
      - ESLint9_es-x_no-modules
      - ESLint9_es-x_no-block-scoped-variables
      - ESLint9_es-x_no-trailing-commas
      - ESLint9_es-x_no-template-literals
      - ESLint9_es-x_no-classes
      - ESLint9_es-x_no-default-parameters
      - ESLint9_es-x_no-destructuring
      - ESLint9_es-x_no-rest-spread-properties
      - ESLint9_es-x_no-spread-elements
      - ESLint9_es-x_no-async-functions
      - ESLint9_es-x_no-generators
      - ESLint9_es-x_no-for-of-loops
      - ESLint9_es-x_no-exponential-operators
      - ESLint9_es-x_no-promise-objects
