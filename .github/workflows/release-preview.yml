name: release-preview

# Dogfoods the reusable release-preview pipeline from nx-devkit/nx.ts.
# The draft "next" release accumulates pending conventional-commit
# releases; publishing it is the human release decision (release.yml
# reacts to release:published — wired separately once the tag scheme is
# generalized beyond `name@version` tags).

on:
  push:
    # feat/* stays until the dogfood branch merges — then drop it.
    branches: [main, 'feat/release-preview-reusable']
  workflow_dispatch:
    inputs:
      specifier:
        description: Force a version specifier (none|patch|minor|major)
        required: false
        type: choice
        options: [none, patch, minor, major]
        default: none

jobs:
  preview:
    # Pinned to the feat/release-reusable head — move to a release tag
    # once nx-devkit/nx.ts publishes one.
    uses: nx-devkit/nx.ts/.github/workflows/release-preview.yml@release-action/v1
    with:
      specifier: ${{ inputs.specifier || 'none' }}
      # Temporary: the callee only runs while the caller ref equals this
      # branch — point it at the dogfood branch until the PR merges, then
      # switch back to main.
      branch: feat/release-preview-reusable
      source-ref: release-action/v1
    secrets:
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
    permissions:
      contents: write # draft release create/edit/delete via GITHUB_TOKEN

  ai-notes:
    needs: preview
    if: github.event_name != 'release' && needs.preview.result == 'success'
    permissions:
      contents: write
      actions: read
      issues: write
      pull-requests: read
      checks: read
    uses: nx-devkit/nx.ts/.github/workflows/release-ai-notes.lock.yml@release-action/v1
    with:
      branch: feat/release-preview-reusable # matches the preview branch above
      disabled: false # ANYROUTER_API_KEY synced from Infisical (project: Github Actions, env: dev)
    secrets:
      ANYROUTER_API_KEY: ${{ secrets.ANYROUTER_API_KEY }}
