name: ci
on:
  push: {}
permissions: {}
jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build:nx-plugins
      - run: bun run build
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    needs: build
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build:nx-plugins
      - run: bun run typecheck
  lint:
    name: lint
    runs-on: ubuntu-latest
    needs: typecheck
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build:nx-plugins
      - run: bun run lint
  test:
    name: test
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build:nx-plugins
      - run: bun run test
  lint-sarif:
    name: lint-sarif
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - run: |-
          sverka_rc=0
          { bun run lint:sarif || true
          } > 'eslint.sarif' || sverka_rc=$?
          cat 'eslint.sarif'
          if [ "$sverka_rc" -gt 0 ]; then exit "$sverka_rc"; fi
        shell: sh
      - name: Upload eslint.sarif
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lint-sarif-eslint.sarif
          path: eslint.sarif
        if: always()
  policy:
    name: policy
    runs-on: ubuntu-latest
    needs: lint-sarif
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build:nx-plugins
      - run: bun run build
      - name: Download eslint.sarif
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: lint-sarif-eslint.sarif
          path: eslint.sarif
      - run: bun packages/cli/src/bin.ts policy --findings "$(find eslint.sarif -type f
          -name '*.sarif' | head -n1)"
        shell: sh
  audit:
    name: audit
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - run: bun audit
  doctor:
    name: doctor
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build:nx-plugins
      - run: bun run build
      - run: bun packages/cli/src/bin.ts doctor
