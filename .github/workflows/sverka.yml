name: ci
on:
  push: {}
permissions:
  actions: read
  contents: read
jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: "actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4"
        with:
          submodules: recursive
      - name: Setup Bun
        uses: "oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2"
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - run: bun run build:nx-plugins
      - run: bun run build
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: "actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4"
        with:
          submodules: recursive
      - name: Setup Bun
        uses: "oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2"
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - run: bun run build:nx-plugins
      - run: bun run typecheck
  lint:
    name: lint
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - name: Checkout
        uses: "actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4"
        with:
          submodules: recursive
      - name: Setup Bun
        uses: "oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2"
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - run: bun run build:nx-plugins
      - run: bun run lint
  test:
    name: test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: "actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4"
        with:
          submodules: recursive
      - name: Setup Bun
        uses: "oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2"
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - run: bun run build:nx-plugins
      - run: bun run test
  lint-sarif:
    name: lint-sarif
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: "actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4"
        with:
          submodules: recursive
      - name: Setup Bun
        uses: "oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2"
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - run: |-
          sverka_rc=0
          { bunx eslint packages/*/src -f @microsoft/eslint-formatter-sarif
          } > 'eslint.sarif' || sverka_rc=$?
          cat 'eslint.sarif'
          if [ "$sverka_rc" -gt 0 ]; then exit "$sverka_rc"; fi
        shell: sh
      - name: Upload eslint.sarif
        uses: "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4"
        with:
          name: lint-sarif-eslint.sarif
          path: eslint.sarif
        if: always()
  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: "actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4"
        with:
          submodules: recursive
      - name: Setup Bun
        uses: "oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2"
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - run: bun audit
  doctor:
    name: doctor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: "actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4"
        with:
          submodules: recursive
      - name: Setup Bun
        uses: "oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2"
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - run: bun run build:nx-plugins
      - run: bun run build
      - run: bun packages/cli/src/bin.ts doctor
