name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "engdocs/user/**"
      - ".github/workflows/deploy-website.yml"
      # The pipeline page runs the CLI and renders the HTML report from
      # source — package changes must redeploy or the site goes stale.
      - "packages/**"
      - "sverka.config.ts"
      - "examples/**"
      # The deploy installs and builds from these too.
      - "package.json"
      - "bun.lock"
      - "nx.json"
  pull_request:
    paths:
      - "website/**"
      - "engdocs/user/**"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # per-ref: a PR build must never cancel an in-flight main deploy
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"
          no-cache: true

      # The /pipeline/ page runs the repo's own `sverka run` from source
      # during the site build — needs root deps installed and workspace
      # packages built (the pipeline's own steps rebuild them anyway).
      - name: Install root dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build workspace packages
        run: bun run build

      - name: Install website dependencies
        run: bun --cwd=${{ github.workspace }}/website install --frozen-lockfile

      - name: Build website
        run: bun --cwd=${{ github.workspace }}/website run build

      # v4.1.1's tag has no built dist/ — the action fails to start.
      # v4.1.3 is the oldest v4 tag that ships dist/index.mjs.
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        if: github.ref == 'refs/heads/main'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: website
          wranglerVersion: "4.136.1"
          command: deploy
