name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "engdocs/user/**"
      - ".github/workflows/deploy-website.yml"
      # The pipeline page runs the CLI and renders the HTML report from
      # source — package changes must redeploy or the site goes stale.
      - "packages/**"
      - "sverka.config.ts"
      - "examples/**"
      # The deploy installs and builds from these too.
      - "package.json"
      - "bun.lock"
      - "nx.json"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build website
    permissions:
      contents: read
    env:
      SITE_URL: https://sverka-dev.github.io
      BASE_PATH: /sverka
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # vendor/nx.ts is a submodule and a bun workspace dep — root
          # `bun install` fails to link @nx-devkit/* without it.
          submodules: true

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"
          no-cache: true

      # The /pipeline/ page runs the repo's own `sverka run` from source
      # during the site build — needs root deps installed and workspace
      # packages built (the pipeline's own steps rebuild them anyway).
      - name: Install root dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build workspace packages
        run: bun run build:nx-plugins && bun run build

      - name: Install website dependencies
        run: bun --cwd=${{ github.workspace }}/website install --frozen-lockfile

      - name: Build website
        run: bun --cwd=${{ github.workspace }}/website run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/.output/public

  deploy:
    runs-on: ubuntu-latest
    name: Deploy to GitHub Pages
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
