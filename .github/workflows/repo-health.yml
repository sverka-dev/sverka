name: repo-health
on:
  workflow_dispatch: null
  schedule:
    - cron: 17 6 * * *
env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
permissions: {}
jobs:
  main-green:
    name: main-green
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: read
      security-events: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: suite=""; if [ -n "$GITHUB_RUN_ID" ]; then suite=$(gh api
          'repos/{owner}/{repo}/actions/runs/'"$GITHUB_RUN_ID" --jq
          .check_suite_id) || exit 1; fi; out=$(gh api --paginate --slurp
          'repos/{owner}/{repo}/commits/main/check-runs?per_page=100' | jq -r
          --arg suite "$suite" 'map(.check_runs) | add | group_by(.name) |
          map(last)[] | select(.app.slug=="github-actions") |
          select((.check_suite.id | tostring) != $suite) | select(.conclusion !=
          "success" and .conclusion != "skipped" and .conclusion != "neutral") |
          "\(.name) (\(.conclusion // .status))"') || exit 1; [ -z "$out" ] || {
          echo "non-green or in-progress checks on main:"; echo "$out"; exit 1;
          }
        shell: sh
  review-debt:
    name: review-debt
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: read
      security-events: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: |-
          # shellcheck disable=SC2016
          count=$(gh api graphql -f query='query($owner:String!,$name:String!){repository(owner:$owner,name:$name){pullRequests(first:20,states:MERGED,orderBy:{field:CREATED_AT,direction:DESC}){nodes{reviewThreads(first:100){pageInfo{hasNextPage}nodes{isResolved}}}}}}' -F owner='{owner}' -F name='{repo}' --jq '([.data.repository.pullRequests.nodes[].reviewThreads.nodes[]|select(.isResolved==false)]|length) + ([.data.repository.pullRequests.nodes[].reviewThreads.pageInfo.hasNextPage|select(.)]|length)') || exit 1; [ "$count" = "0" ] || { echo "unresolved threads or truncated thread pages: $count"; exit 1; }
        shell: sh
  stale-branches:
    name: stale-branches
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: read
      security-events: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: if ! heads=$(git ls-remote --heads origin); then echo "ls-remote failed";
          exit 1; fi; if ! owner=$(gh repo view --json owner --jq
          '.owner.login'); then echo "repo query failed"; exit 1; fi; stale="";
          for b in $(echo "$heads" | sed 's|.*refs/heads/||'); do if [ "$b" !=
          "main" ]; then if ! n=$(gh pr list --head "$owner:$b" --state merged
          --json number --jq length); then echo "pr query failed for $b"; exit
          1; fi; if [ "$n" -gt 0 ]; then stale="$stale $b"; fi; fi; done; [ -z
          "$stale" ] || { echo "stale branches:$stale"; exit 1; }
        shell: sh
  external-checks:
    name: external-checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: read
      security-events: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: if ! out=$(gh api --paginate --slurp
          'repos/{owner}/{repo}/commits/main/check-runs?per_page=100' | jq -r
          'map(.check_runs) | add | group_by(.name) | map(last)[] |
          select(.app.slug != "github-actions") | select(.conclusion !=
          "success" and .conclusion != "skipped" and .conclusion != "neutral") |
          "\((.app.slug|gsub("[\\x00-\\x1f\\x7f]";"")))\t\(.conclusion //
          .status)\t\((.name|gsub("[\\x00-\\x1f\\x7f]";"")))"'); then echo
          "check-runs query failed — report skipped"; exit 0; fi; if [ -z "$out"
          ]; then echo "all non-Actions checks on main are green"; else echo
          "non-Actions checks not green on main (reported, not gating):"; echo
          "$out"; fi
        shell: sh
  dependabot-alerts:
    name: dependabot-alerts
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: read
      security-events: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: "[ -z \"$REPO_HEALTH_TOKEN\" ] || export GH_TOKEN=\"$REPO_HEALTH_TOKEN\";
          out=$(gh api --paginate
          'repos/{owner}/{repo}/dependabot/alerts?state=open' --jq '.[].number'
          2>&1) || { if echo \"$out\" | grep -qi \"not accessible\\|403\"; then
          if [ -n \"$REPO_HEALTH_TOKEN\" ]; then echo \"REPO_HEALTH_TOKEN cannot
          read dependabot alerts — check its scopes (vulnerability-alerts read)
          or remove the secret\"; exit 1; fi; echo \"::warning::GITHUB_TOKEN
          cannot read dependabot alerts (needs the vulnerability-alerts scope);
          check skipped\"; exit 0; fi; echo \"$out\"; exit 1; }; [ -z \"$out\" ]
          || { echo \"open dependabot alerts:\"; echo \"$out\"; exit 1; }"
        env:
          REPO_HEALTH_TOKEN: ${{ secrets.REPO_HEALTH_TOKEN }}
        shell: sh
  code-scanning-alerts:
    name: code-scanning-alerts
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: read
      security-events: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: "out=$(gh api --paginate
          'repos/{owner}/{repo}/code-scanning/alerts?state=open' --jq '.[] |
          \"\\(.number)\\t\\(.tool.name)\\t\\(.rule.security_severity_level //
          .rule.severity //
          \"-\")\\t\\(.rule.id)\\t\\(.most_recent_instance.location.path):\\(.m\
          ost_recent_instance.location.start_line)\"' 2>&1) || { if echo
          \"$out\" | grep -qi \"rate limit\"; then echo \"$out\"; echo
          \"::error::GitHub API rate limit — code-scanning alerts NOT checked\";
          exit 1; fi; if echo \"$out\" | grep -qiE \"not accessible|403|410|not
          enabled\"; then echo \"::warning::GITHUB_TOKEN cannot read
          code-scanning alerts (needs the security-events: read scope, and code
          scanning enabled); check skipped\"; exit 0; fi; echo \"$out\"; exit 1;
          }; [ -z \"$out\" ] || { echo \"open code-scanning alerts:\"; echo
          \"$out\"; exit 1; }"
        shell: sh
  code-scanning-tools:
    name: code-scanning-tools
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: read
      security-events: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: "now=$(date -u +%s); out=$(gh api --paginate
          'repos/{owner}/{repo}/code-scanning/analyses?per_page=100' 2>&1 | jq
          -rs --argjson now \"$now\" 'map(.) | add | group_by(.tool.name) |
          map(max_by(.created_at)) | map({tool: .tool.name, created:
          .created_at, age: (((($now - (.created_at | fromdateiso8601)) / 86400)
          | floor)), error: (.error // \"\")}) | .[] | if (.age > 14 or .error
          != \"\") then \"STALE\\t\\(.tool)\\tlast analysis \\(.created)
          (\\(.age) days ago)\\(if .error != \"\" then \" — failed: \\(.error)\"
          else \"\" end)\" else \"OK\\t\\(.tool)\\tlast analysis \\(.created)
          (\\(.age) days ago)\" end' 2>&1) || { if echo \"$out\" | grep -qiE
          \"not accessible|403|410|not enabled\"; then echo
          \"::warning::GITHUB_TOKEN cannot read code-scanning analyses (needs
          the security-events: read scope); check skipped\"; exit 0; fi; echo
          \"$out\"; exit 1; }; stale=$(printf \"%s\\n\" \"$out\" | grep
          \"^STALE\" || true); [ -z \"$stale\" ] || { echo \"code-scanning tools
          whose configuration is stale:\"; printf \"%s\\n\" \"$stale\" | sed
          \"s/^STALE\\t/  /\"; echo \"::error::a stale code-scanning
          configuration keeps the GitHub Security banner up — re-run the
          analysis (make the tool report again) or delete the stale
          configuration\"; exit 1; }; printf \"%s\\n\" \"$out\" | sed
          \"s/^OK\\t/  /\""
        shell: sh
  secret-scanning-alerts:
    name: secret-scanning-alerts
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: read
      security-events: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: "[ -z \"$REPO_HEALTH_TOKEN\" ] || export GH_TOKEN=\"$REPO_HEALTH_TOKEN\";
          failed=0; out=$(gh api --paginate
          'repos/{owner}/{repo}/secret-scanning/alerts?state=open' --jq '.[] |
          \"\\(.number)\\t\\(.resolution //
          \"-\")\\t\\(.secret_type_display_name //
          .secret_type)\\t\\(.html_url)\"' 2>&1) || { if echo \"$out\" | grep
          -qi \"rate limit\"; then echo \"$out\"; echo \"::error::GitHub API
          rate limit — secret-scanning alerts NOT checked\"; exit 1; fi; if echo
          \"$out\" | grep -qiE \"not accessible|403|404\"; then if [ -n
          \"$REPO_HEALTH_TOKEN\" ]; then echo \"REPO_HEALTH_TOKEN cannot read
          secret-scanning alerts — check its scopes (secret-scanning-alerts
          read) or remove the secret\"; exit 1; fi; echo \"::warning::no token
          with the secret-scanning-alerts scope (REPO_HEALTH_TOKEN) —
          secret-scanning alerts NOT checked\"; exit 0; fi; echo \"$out\"; exit
          1; }; [ -z \"$out\" ] || { echo \"open secret-scanning alerts:\"; echo
          \"$out\"; failed=1; }; prot=$(gh api 'repos/{owner}/{repo}' --jq
          '.security_and_analysis.secret_scanning_push_protection.status //
          \"unknown\"' 2>/dev/null || echo unknown); [ \"$prot\" = \"enabled\" ]
          || { echo \"::error::secret scanning push protection is $prot
          (expected enabled)\"; failed=1; }; exit $failed"
        env:
          REPO_HEALTH_TOKEN: ${{ secrets.REPO_HEALTH_TOKEN }}
        shell: sh
  published-advisories:
    name: published-advisories
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: read
      security-events: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: "[ -z \"$REPO_HEALTH_TOKEN\" ] || export GH_TOKEN=\"$REPO_HEALTH_TOKEN\";
          out=$(gh api --paginate 'repos/{owner}/{repo}/security-advisories'
          --jq '.[] | select(.state == \"published\") |
          \"\\(.ghsa_id)\\t\\(.severity)\\t\\(.summary)\"' 2>&1) || { if echo
          \"$out\" | grep -qi \"rate limit\"; then echo \"$out\"; echo
          \"::error::GitHub API rate limit — published advisories NOT checked\";
          exit 1; fi; if echo \"$out\" | grep -qiE \"not accessible|403\"; then
          if [ -n \"$REPO_HEALTH_TOKEN\" ]; then echo \"REPO_HEALTH_TOKEN cannot
          read repository advisories — check its scopes (repository-advisories
          read) or remove the secret\"; exit 1; fi; echo \"::warning::no token
          with the repository-advisories scope (REPO_HEALTH_TOKEN) — published
          advisories NOT checked\"; exit 0; fi; echo \"$out\"; exit 1; }; [ -z
          \"$out\" ] || { echo \"open published advisories:\"; echo \"$out\";
          exit 1; }"
        env:
          REPO_HEALTH_TOKEN: ${{ secrets.REPO_HEALTH_TOKEN }}
        shell: sh
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: read
      security-events: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: if command -v zizmor >/dev/null 2>&1; then zizmor --version; zizmor
          .github/workflows/; else pipx run --spec zizmor==1.30.1 zizmor
          .github/workflows/; fi
        shell: sh
  zizmor-sarif:
    name: zizmor-sarif
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: read
      security-events: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: mkdir -p .sverka; if command -v zizmor >/dev/null 2>&1; then zizmor
          --format sarif .github/workflows/ > .sverka/zizmor.sarif; else pipx
          run --spec zizmor==1.30.1 zizmor --format sarif .github/workflows/ >
          .sverka/zizmor.sarif; fi; true
        shell: sh
      - name: Upload sarif
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v3
        with:
          sarif_file: .sverka/zizmor.sarif
  open-prs:
    name: open-prs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      checks: read
      security-events: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: gh pr list --state open --limit 100 --json number,title,author --jq '.[] |
          "#\(.number) \(.title) (@\(.author.login))"' || true
        shell: sh
