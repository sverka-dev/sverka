name: repo-health
on:
  workflow_dispatch:
    inputs:
      GITHUB_TOKEN:
        type: string
        default: ""
  schedule:
    - cron: 17 6 * * *
env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
permissions: {}
jobs:
  main-green:
    name: main-green
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
      security-events: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - run: "conclusion=$(gh run list --branch main --limit 1 --json conclusion --jq
          '.[0].conclusion') && echo \"main: $conclusion\" && [ \"$conclusion\"
          = \"success\" ]"
        shell: sh
  review-debt:
    name: review-debt
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
      security-events: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - run: gh api graphql -f
          query='query($owner:String!,$name:String!){repository(owner:$owner,name:$name){pullRequests(last:20,states:MERGED){nodes{reviewThreads(first:100){nodes{isResolved}}}}}}'
          -F owner='{owner}' -F name='{repo}' --jq
          '[.data.repository.pullRequests.nodes[].reviewThreads.nodes[]|select(.isResolved==false)]|length'
          | grep -qx 0
        shell: sh
  stale-branches:
    name: stale-branches
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
      security-events: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - run: remote=$(git ls-remote --heads origin | sed 's|.*/||') && merged=$(gh pr
          list --state merged --limit 100 --json headRefName --jq
          '.[].headRefName'); stale=""; for b in $merged; do case " $remote " in
          *" $b "*) stale="$stale $b";; esac; done; if [ -n "$stale" ]; then
          echo "stale branches:$stale"; exit 1; fi
        shell: sh
  dependabot-alerts:
    name: dependabot-alerts
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
      security-events: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - run: gh api 'repos/{owner}/{repo}/dependabot/alerts?state=open&per_page=100'
          --jq 'length' | grep -qx 0
        shell: sh
  open-prs:
    name: open-prs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
      security-events: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - run: gh pr list --state open --json number,title,author --jq '.[] | "#\(.number)
          \(.title) (@\(.author.login))"' ; exit 0
        shell: sh
