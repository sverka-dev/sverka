name: Release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [main]
  workflow_dispatch:

# npm OIDC trusted publishing — no NPM_TOKEN anywhere:
#   1. id-token: write lets npm exchange the GHA OIDC token for a short-lived
#      registry token automatically (npm >= 11.5.1, bundled with Node 24).
#   2. registry-url on actions/setup-node points npm at the registry.
#   3. NPM_CONFIG_PROVENANCE=true on the publish step attests provenance.
#   4. Each @sverka/* package must exist on npm with a trusted publisher bound
#      to this file — one-time local bootstrap (requires MFA):
#        npm login
#        bunx nx run tools:prepare-for-release --trust --trustRepo=sverka-dev/sverka
permissions: {}

jobs:
  release:
    # workflow_dispatch can target any branch — restrict releases to main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - run: bun install --frozen-lockfile --ignore-scripts

      - name: Configure git for release commit and tag push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}"
          # Queued runs checkout the SHA of their push event, which may be
          # behind main's tip — the release push would then be rejected as
          # non-fast-forward. Catch up first; ff-only fails loudly if the
          # checkout somehow diverged.
          git fetch origin main
          git merge --ff-only origin/main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: ./node_modules/.bin/nx run-many -t lint build test --exclude=skills-*,pack-skills-*
        env:
          NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_READ_TOKEN }}

      # Version + changelog run under bun (bun.lock → pm detection), which
      # tolerates workspace:* in manifests. `nx release publish` can't be used:
      # npm refuses workspace protocols and bun publish has no OIDC support —
      # so publish is a plain npm loop over the manifests rewritten below.
      # Tag and push happen in the changelog step so the release commit +
      # CHANGELOG commit + tag land atomically — a failed changelog leaves
      # nothing pushed and the run can simply be re-dispatched.
      # `released=false` when no conventional-commit bump applied (docs/ci/chore
      # merges, or the workflow's own release commits retriggering this run) —
      # downstream steps must skip or they'd fail on the already-existing tag.
      # Detection compares HEAD before/after: a run triggered BY a release
      # commit already has a "chore(release)" subject, so subject alone is
      # not sufficient.
      - name: Version packages (bump, commit)
        id: version
        run: |
          before_head="$(git rev-parse HEAD)"
          ./node_modules/.bin/nx release version
          if [ "$before_head" != "$(git rev-parse HEAD)" ] && git log -1 --format=%s | grep -q "^chore(release)"; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_READ_TOKEN }}

      # The lockfile records the workspace package versions — without a
      # refresh it stays behind the bump, and every 'bun install' then
      # rewrites bun.lock (a dirty tree for everyone, and a diff that
      # reappears in unrelated PRs). Fold the refreshed lockfile into the
      # release commit.
      - name: Sync bun.lock with the released versions
        if: steps.version.outputs.released == 'true'
        run: |
          bun install --lockfile-only
          # Only amend when HEAD is the release commit — on a no-op version
          # step HEAD is an unrelated commit and must not be rewritten.
          if [ -n "$(git status --porcelain bun.lock)" ] && git log -1 --format=%s | grep -q "^chore(release)"; then
            git add bun.lock
            git commit --amend --no-edit
          fi

      # plugin.json tracks the released version — fold it into the release
      # commit (nothing is pushed until the changelog step's --atomic push).
      - name: Sync plugin.json version
        if: steps.version.outputs.released == 'true'
        run: |
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('plugin.json', 'utf8'));
            p.version = require('./packages/cli/package.json').version;
            fs.writeFileSync('plugin.json', JSON.stringify(p, null, 2) + '\n');
          "
          # Only amend when HEAD is the release commit — on a no-op version
          # step HEAD is an unrelated commit and must not be rewritten.
          if [ -n "$(git status --porcelain plugin.json)" ] && git log -1 --format=%s | grep -q "^chore(release)"; then
            git add plugin.json
            git commit --amend --no-edit
          fi

      - name: Changelog + GitHub release
        if: steps.version.outputs.released == 'true'
        # Standalone changelog requires the version positionally; fixed group
        # means every manifest carries it — read it from cli.
        run: ./node_modules/.bin/nx release changelog "$(node -p "require('./packages/cli/package.json').version")"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Rewrite workspace:* -> ^<version> in the working tree only (the release
      # commit already pushed). Restored after publish.
      - run: node scripts/prepare-publish.mjs
        if: steps.version.outputs.released == 'true' || github.event_name == 'workflow_dispatch'

      - name: Publish packages (npm OIDC)
        # A manual dispatch is the recovery path for a publish that failed
        # after the release commit was pushed: the version step is a no-op
        # then, so `released` is false and the publish would be skipped. The
        # step publishes exactly the versions the manifests carry and skips
        # the ones that are already on npm — a dispatch with nothing missing
        # is a no-op.
        if: steps.version.outputs.released == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          failed=0
          # Publish exactly the packages `nx release` versions — the lockstep
          # group in nx.json. A package outside that group keeps its own
          # version and is not on npm: publishing it fails with a 404 and
          # takes the whole release (and main) down.
          projects=$(node -p "
            const cfg = require('./nx.json');
            if (!cfg.release || !Array.isArray(cfg.release.projects)) {
              process.stderr.write('ERROR: nx.json release.projects is not a flat string array\n');
              process.exit(1);
            }
            cfg.release.projects.join(' ');
          ") || exit 1
          for project in $projects; do
            dir="packages/$project"
            pkg="$dir/package.json"
            if [ -f "$pkg" ] && [ -f "$dir/dist/index.mjs" ]; then
              name=$(node -p "require('./$pkg').name")
              version=$(node -p "require('./$pkg').version")
              published=0
              if npm view "$name@$version" version >/dev/null 2>&1; then
                # Already registered — but the tarball still has to be
                # served: a version that was published and never served
                # leaves `npm i sverka` broken, and a re-run must not
                # report success over it. The probe below decides.
                echo "$name@$version is already published — checking that its tarball is served"
                published=1
              else
                echo "Publishing $name@$version"
                # ./ prefix is required: npm parses a bare "packages/x" spec as
                # github:packages/x shorthand and fails on git ls-remote.
                # A publish can also fail transiently (registry/CDN hiccup) and
                # leave the version registered without a tarball — which breaks
                # `npm i sverka` for everyone. Retry, then verify the tarball is
                # actually fetchable.
                for attempt in 1 2 3; do
                  if npm publish "./$dir" --access public --provenance; then
                    published=1
                    break
                  fi
                  if [ "$attempt" -lt 3 ]; then
                    echo "::warning::publish attempt $attempt failed for $name@$version — retrying"
                    sleep 10
                  fi
                done
                if [ "$published" -ne 1 ]; then
                  echo "::error::could not publish $name@$version"
                  failed=1
                  continue
                fi
              fi
              # A version is not served instantly — the registry (and its
              # CDN) needs a moment to publish the tarball. Probe over a few
              # minutes before calling it broken, otherwise the check fails
              # the release on a propagation delay (the registry regularly
              # needs well over the old 20 seconds for a first publish, while
              # a later publish of the same run is already served). The
              # deadline caps the whole probe, and both requests carry their
              # own timeout — a stalled request must not hold the release
              # open.
              #
              # Ten minutes, because the delay is not bounded by anything
              # the publisher controls: a 0.2.42 publish was registered and
              # unserved for more than three. A failed publish is recovered
              # by dispatching this workflow again — it publishes the
              # versions that are missing and re-checks the ones that are
              # out.
              fetchable=0
              deadline=$(( $(date +%s) + 600 ))
              probe=0
              while [ "$(date +%s)" -lt "$deadline" ]; do
                probe=$((probe + 1))
                tarball=$(npm view "$name@$version" dist.tarball --fetch-timeout=20000 --fetch-retries=0 2>/dev/null || echo "")
                if [ -n "$tarball" ] && curl -sfI --max-time 30 "$tarball" >/dev/null 2>&1; then
                  fetchable=1
                  break
                fi
                echo "::warning::$name@$version is registered but not served yet — probing again ($probe)"
                sleep 30
              done
              if [ "$fetchable" -eq 1 ]; then
                echo "$name@$version is on npm (tarball fetchable)"
              else
                echo "::error::$name@$version is registered but its tarball is not fetchable — npm install of this package would fail"
                failed=1
              fi
            fi
          done
          exit $failed
        env:
          NPM_CONFIG_PROVENANCE: "true"

      - name: Restore workspace:* protocol
        run: |
          if [ -n "$(git status --porcelain -- 'packages/*/package.json')" ]; then
            git checkout -- packages/*/package.json
          fi
        if: always()
