name: Release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [main]
  workflow_dispatch:

# npm OIDC trusted publishing — no NPM_TOKEN anywhere:
#   1. id-token: write lets npm exchange the GHA OIDC token for a short-lived
#      registry token automatically (npm >= 11.5.1, bundled with Node 24).
#   2. registry-url on actions/setup-node points npm at the registry.
#   3. NPM_CONFIG_PROVENANCE=true on the publish step attests provenance.
#   4. Each @sverka/* package must exist on npm with a trusted publisher bound
#      to this file — one-time local bootstrap (requires MFA):
#        npm login
#        bunx nx run tools:prepare-for-release --trust --trustRepo=sverka-dev/sverka
permissions:
  contents: write
  id-token: write

jobs:
  release:
    # workflow_dispatch can target any branch — restrict releases to main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: true

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build:nx-plugins

      - name: Configure git for release commit and tag push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: ./node_modules/.bin/nx run-many -t lint build test --exclude=skills-*,pack-skills-*
        env:
          NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_READ_TOKEN }}

      # Version + changelog run under bun (bun.lock → pm detection), which
      # tolerates workspace:* in manifests. `nx release publish` can't be used:
      # npm refuses workspace protocols and bun publish has no OIDC support —
      # so publish is a plain npm loop over the manifests rewritten below.
      # Tag and push happen in the changelog step so the release commit +
      # CHANGELOG commit + tag land atomically — a failed changelog leaves
      # nothing pushed and the run can simply be re-dispatched.
      # `released=false` when no conventional-commit bump applied (docs/ci/chore
      # merges, or the workflow's own release commits retriggering this run) —
      # downstream steps must skip or they'd fail on the already-existing tag.
      - name: Version packages (bump, commit)
        id: version
        run: |
          ./node_modules/.bin/nx release version
          if git log -1 --format=%s | grep -q "^chore(release)"; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_READ_TOKEN }}

      # plugin.json tracks the released version — fold it into the release
      # commit (nothing is pushed until the changelog step's --atomic push).
      - name: Sync plugin.json version
        if: steps.version.outputs.released == 'true'
        run: |
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('plugin.json', 'utf8'));
            p.version = require('./packages/cli/package.json').version;
            fs.writeFileSync('plugin.json', JSON.stringify(p, null, 2) + '\n');
          "
          # Only amend when HEAD is the release commit — on a no-op version
          # step HEAD is an unrelated commit and must not be rewritten.
          if [ -n "$(git status --porcelain plugin.json)" ] && git log -1 --format=%s | grep -q "^chore(release)"; then
            git add plugin.json
            git commit --amend --no-edit
          fi

      - name: Changelog + GitHub release
        if: steps.version.outputs.released == 'true'
        # Standalone changelog requires the version positionally; fixed group
        # means every manifest carries it — read it from cli.
        run: ./node_modules/.bin/nx release changelog "$(node -p "require('./packages/cli/package.json').version")"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Rewrite workspace:* -> ^<version> in the working tree only (the release
      # commit already pushed). Restored after publish.
      - run: node scripts/prepare-publish.mjs
        if: steps.version.outputs.released == 'true'

      - name: Publish packages (npm OIDC)
        if: steps.version.outputs.released == 'true'
        run: |
          failed=0
          for pkg in packages/*/package.json; do
            dir=$(dirname "$pkg")
            if [ -f "$dir/dist/index.mjs" ]; then
              name=$(node -p "require('./$pkg').name")
              version=$(node -p "require('./$pkg').version")
              if npm view "$name@$version" version >/dev/null 2>&1; then
                echo "Skipping $name@$version (already published)"
                continue
              fi
              echo "Publishing $name@$version"
              # ./ prefix is required: npm parses a bare "packages/x" spec as
              # github:packages/x shorthand and fails on git ls-remote.
              npm publish "./$dir" --access public --provenance || failed=1
            fi
          done
          exit $failed
        env:
          NPM_CONFIG_PROVENANCE: "true"

      - name: Restore workspace:* protocol
        run: |
          if [ -n "$(git status --porcelain -- 'packages/*/package.json')" ]; then
            git checkout -- packages/*/package.json
          fi
        if: always()
