# SonarCloud configuration
# https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/analysis-parameters/

# Project key (must match SonarCloud project settings)
sonar.projectKey=sverka-dev_sverka
sonar.organization=sverka-dev

# Source directories
sonar.sources=packages

# Exclude non-source paths from analysis
sonar.exclusions=\
  **/dist/**,\
  **/node_modules/**,\
  **/__tests__/**,\
  **/*.test.ts,\
  **/*.test.tsx,\
  pack/**,\
  .agents/**,\
  .gc/**,\
  .husky/**,\
  website/**,\
  engdocs/**,\
  specs/**,\
  **/*.md,\
  **/*.json,\
  **/*.toml,\
  **/*.yml,\
  **/*.yaml

# Test directories (excluded from duplication + security checks)
sonar.tests=packages
sonar.test.inclusions=**/__tests__/**,**/*.test.ts

# Coverage (will be imported from vitest reports when available)
# sonar.coverage.exclusions=**/__tests__/**,**/*.test.ts

# TypeScript configuration
sonar.typescript.tsconfigPath=tsconfig.json

# Duplication threshold (default is 3%, we accept up to 5% on new code)
# This is configured in SonarCloud UI Quality Gate, not here

# Language
sonar.language=ts
