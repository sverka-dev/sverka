# SonarCloud configuration
# https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/analysis-parameters/

# Project key (must match SonarCloud project settings)
sonar.projectKey=sverka-dev_sverka
sonar.organization=sverka-dev

# Source directories
sonar.sources=packages

# Exclude non-source paths from analysis (single line for reliability)
sonar.exclusions=**/dist/**,**/node_modules/**,**/__tests__/**,**/*.test.ts,**/*.test.tsx,**/*.md,**/*.json,**/*.toml,**/*.yml,**/*.yaml

# TypeScript configuration
sonar.typescript.tsconfigPath=tsconfig.json

# Language
sonar.language=ts
